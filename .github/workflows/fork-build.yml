name: Build fork artifacts

# Manual trigger only: this fork must never build on a push or on a tag, because
# every run consumes the account's Actions minutes.
#
# Builds only what this fork needs:
#   - hiddify-lib-android.tar.gz        (hiddify-core.aar)
#   - hiddify-lib-windows-amd64.tar.gz  (hiddify-core.dll + HiddifyCli.exe + desktop.h)
#   - hiddify-lib-macos.tar.gz          (hiddify-core.dylib + desktop.h)
#
# The asset names match what hiddify-app's Makefile downloads
# ($(CORE_NAME)-<platform>.tar.gz, CORE_NAME=hiddify-lib), so pointing the app at
# this fork's release works without changing the app.
on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: "Release tag to attach the artifacts to (e.g. v4.1.0-f1)"
        type: string
        required: true
        default: "v4.1.0-f1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: hiddify-lib-android
            target: android
            runner: ubuntu-22.04
          - artifact: hiddify-lib-windows-amd64
            target: windows-amd64
            runner: ubuntu-22.04
          # The desktop library for macOS is a c-shared dylib that is lipo'd from
          # an amd64 and an arm64 build, so it needs a real macOS toolchain: it
          # cannot be produced from Linux or Windows. macOS runners are free for
          # public repositories, which this one is.
          - artifact: hiddify-lib-macos
            target: macos
            runner: macos-14
          - artifact: hiddify-lib-linux-amd64
            target: linux-amd64
            runner: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.26.0"

      - name: Install mingw-w64
        if: matrix.target == 'windows-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version | head -n1

      # The linux target links a c-shared library with the host toolchain, and
      # the image does not always provide a linker for that, which shows up as
      # "collect2: fatal error: cannot find 'ld'".
      - name: Install build tools
        if: matrix.target == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils
          gcc --version | head -n1
          ld --version | head -n1

      - name: Setup Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android NDK
        if: matrix.target == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Show versions
        run: |
          go version
          (gcc --version || clang --version) | head -n1
          uname -a

      - name: Build
        env:
          # Only needed by the android target; setup-ndk leaves it empty for
          # windows, which is harmless.
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          if [ "${{ matrix.target }}" = "linux-amd64" ]; then
            # `make linux-amd64` is not used here on purpose. Its recipe first
            # loads cronet/cronet.env, which the cronet-linux-amd64 target writes
            # after cloning cronet-go with its submodules and downloading a whole
            # toolchain: far more than this fork needs, because with_purego makes
            # sing-box resolve libcronet at runtime instead of linking it.
            # It then builds the CLI from ./cmd/bydll, a cgo build that fails on
            # this image with "collect2: fatal error: cannot find 'ld'" even
            # though ld is installed and the library link above it succeeds. The
            # recipe ends with `;` rather than `&&`, so it reports success and
            # carries on, and the target only fails at the end.
            #
            # Building the two commands directly is both clearer and more
            # reliable: the c-shared library exactly as the recipe builds it, and
            # the CLI statically from ./cmd/main, which needs no cgo at all.
            make prepare
            mkdir -p bin/lib cronet
            : > cronet/cronet.env
            TAGS="$(grep -E '^TAGS=' Makefile | cut -d= -f2)"
            CGO_ENABLED=1 go build -trimpath -ldflags="-w -s -checklinkname=0 -buildid=" \
              -buildmode=c-shared -tags "$TAGS,with_purego" -o bin/lib/hiddify-core.so ./platform/desktop
            go build -trimpath -ldflags="-w -s -checklinkname=0 -buildid=" \
              -tags "$TAGS,with_purego" -o bin/HiddifyCli ./cmd/main
            chmod +x bin/HiddifyCli
          else
            make ${{ matrix.target }}
          fi

      - name: Package
        run: |
          set -e
          mkdir -p out
          if [ "${{ matrix.target }}" = "android" ]; then
            # `make android` produces a single .aar; its jni/<abi>/*.so members
            # are packaged inside it, exactly as the upstream build does.
            test -f bin/hiddify-core.aar || { echo "hiddify-core.aar missing"; exit 1; }
            tar -czvf "out/${{ matrix.artifact }}.tar.gz" -C bin hiddify-core.aar
          elif [ "${{ matrix.target }}" = "macos" ]; then
            test -f bin/hiddify-core.dylib || { echo "hiddify-core.dylib missing"; exit 1; }
            # `make macos` leaves the cgo header as bin/desktop.h. Upstream's
            # macOS tarball ships the dylib alone, but hiddify-app's ffigen needs
            # hiddify-core/bin/desktop.h, so ship it here as well and the app
            # build no longer needs a C toolchain to regenerate it.
            test -f bin/desktop.h || { echo "bin/desktop.h missing"; exit 1; }
            tar -czvf "out/${{ matrix.artifact }}.tar.gz" -C bin hiddify-core.dylib desktop.h
          elif [ "${{ matrix.target }}" = "linux-amd64" ]; then
            # Layout the app expects: hiddify-core/bin/lib/hiddify-core.so and
            # hiddify-core/bin/HiddifyCli, as installed by linux/CMakeLists.txt.
            test -f bin/lib/hiddify-core.so || { echo "bin/lib/hiddify-core.so missing"; exit 1; }
            test -f bin/HiddifyCli || { echo "bin/HiddifyCli missing"; exit 1; }
            tar -czvf "out/${{ matrix.artifact }}.tar.gz" -C bin lib/hiddify-core.so HiddifyCli
          else
            test -f bin/hiddify-core.dll || { echo "hiddify-core.dll missing"; exit 1; }
            test -f bin/HiddifyCli.exe || { echo "HiddifyCli.exe missing"; exit 1; }
            # Ship the cgo-generated header as well, for the same reason as the
            # macOS leg above.
            if [ -f bin/hiddify-core.h ]; then
              cp bin/hiddify-core.h bin/desktop.h
              tar -czvf "out/${{ matrix.artifact }}.tar.gz" \
                -C bin hiddify-core.dll HiddifyCli.exe desktop.h
            else
              echo "warning: bin/hiddify-core.h not found, packaging without the header"
              tar -czvf "out/${{ matrix.artifact }}.tar.gz" \
                -C bin hiddify-core.dll HiddifyCli.exe
            fi
          fi
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}.tar.gz
          retention-days: 7

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-name }}
          files: out/${{ matrix.artifact }}.tar.gz
          fail_on_unmatched_files: false
